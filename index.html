<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Gaming | Premium UC Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --sakura-pink: #ffb7c5; 
            --sakura-dark: #1a1a2e; 
            --sakura-card: rgba(22, 33, 62, 0.85); 
            --text-color: #ffffff; 
            --kick-green: #53fc18;
            --tiktok-pink: #fe2c55;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-image: linear-gradient(rgba(26, 26, 46, 0.4), rgba(26, 26, 46, 0.65)), url('Cherry_Blossom_45_B.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; 
            color: var(--text-color); padding: 20px; display: flex; flex-direction: column; min-height: 100vh;
        }
        
        .content-wrapper { flex: 1; max-width: 1000px; margin: 0 auto; width: 100%; }
        .header { text-align: center; margin-bottom: 40px; }
        .site-name { font-size: 2.8rem; color: var(--sakura-pink); font-weight: 800; text-transform: uppercase; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }

        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 50px; }
        .card { background-color: var(--sakura-card); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid rgba(45, 52, 86, 0.5); backdrop-filter: blur(6px); transition: 0.3s; }
        .card:hover { transform: translateY(-8px); border-color: var(--sakura-pink); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .price { font-size: 1.2rem; font-weight: 800; color: var(--sakura-pink); margin-bottom: 15px; }
        .buy-btn { background-color: var(--sakura-pink); color: var(--sakura-dark); border: none; padding: 12px; border-radius: 8px; font-weight: 800; text-decoration: none; display: block; }

        /* YAYIN PENCERELERİ */
        .stream-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 50px; }
        .stream-box { background: rgba(22, 33, 62, 0.9); border-radius: 20px; padding: 20px; border: 2px solid #555; text-align: center; }
        .stream-box.kick { border-color: var(--kick-green); }
        .stream-box.tiktok { border-color: var(--tiktok-pink); }
        .stream-title { font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .responsive-container { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background: #000; }
        .responsive-container iframe, .responsive-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .footer { text-align: center; padding: 20px; border-top: 1px solid #444; }

        @media (max-width: 768px) { .product-grid, .stream-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="content-wrapper">
    <div class="header">
        <div class="site-name">SAKURA GAMING</div>
    </div>

    <div class="product-grid" id="product-grid"></div>

    <!-- YAYINLAR -->
    <div class="stream-section">
        <!-- Kick Canlı -->
        <div class="stream-box kick">
            <div class="stream-title"><i class="fa-solid fa-gamepad"></i> KICK CANLI</div>
            <div class="responsive-container">
                <iframe src="https://player.kick.com/sakuraharuno7" allowfullscreen="true"></iframe>
            </div>
        </div>
        <!-- TikTok Canlı (Görsel Arayüz) -->
        <div class="stream-box tiktok">
            <div class="stream-title"><i class="fab fa-tiktok"></i> TIKTOK CANLI</div>
            <div class="responsive-container">
                <a href="https://www.tiktok.com/@sakura___gaming/live" target="_blank">
                    <!-- Buraya kendi yayın görselini koyabilirsin -->
                    <img src="https://images.unsplash.com/photo-1542751110-97427bbecf20?auto=format&fit=crop&w=800&q=80" alt="TikTok Yayınına Git">
                    <div style="position:absolute; bottom:10px; width:100%; text-align:center; font-weight:bold; color:white; text-shadow:2px 2px 4px #000;">YAYINA GİTMEK İÇİN TIKLA</div>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const products = [
        { name: "PUBG Mobile 60 UC", price: 10, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on.png?v=1779650124&width=1200", link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-60-uc" },
        { name: "PUBG Mobile 325 UC", price: 45, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_1.png?v=1779650145&width=1200", link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-325-uc" },
        { name: "PUBG Mobile 660 UC", price: 85, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_2.png?v=1779650163&width=1200", link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-660-uc" },
        { name: "PUBG Mobile 1800 UC", price: 215, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_3.png?v=1779650179&width=1200", link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-1800-uc" },
        { name: "PUBG Mobile 3850 UC", price: 425, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_4.png?v=1779650202&width=1200", link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-3850-uc" },
        { name: "PUBG Mobile 8100 UC", price: 850, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_5_-Photoroom.png?v=1779650243&width=1200", link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-8100-uc" }
    ];

    const grid = document.getElementById('product-grid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="card">
                <img src="${p.image}" alt="${p.name}">
                <h3>${p.name}</h3>
                <div class="price">${p.price} Dh</div>
                <a href="${p.link}" class="buy-btn" target="_blank">Satın Al</a>
            </div>
        `;
    });
</script>

</body>
</html>
