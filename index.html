<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Gaming | Premium UC Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --sakura-pink: #ffb7c5; 
            --sakura-dark: #1a1a2e; 
            --sakura-card: #16213e; 
            --text-color: #ffffff; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--sakura-dark); color: var(--text-color); padding: 20px; }
        
        .header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        .site-name { font-size: 2.8rem; color: var(--sakura-pink); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #888; margin-top: 5px; }

        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; max-width: 1000px; margin: 0 auto; }
        
        .card { background-color: var(--sakura-card); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #2d3456; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); border-color: var(--sakura-pink); }
        .card img { width: 100%; height: auto; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .card h3 { margin-bottom: 10px; font-size: 1rem; }
        .price { font-size: 1.2rem; font-weight: 800; color: var(--sakura-pink); margin-bottom: 15px; }
        
        .buy-btn { background-color: var(--sakura-pink); color: var(--sakura-dark); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; text-decoration: none; display: block; width: 100%; transition: 0.3s; }
        .buy-btn:hover { opacity: 0.9; }

        @media (max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .product-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <div class="site-name">SAKURA GAMING</div>
    <p class="subtitle">Centre de recharge UC sécurisé et rapide</p>
</div>

<div class="product-grid" id="product-grid"></div>

<script>
    const products = [
        { 
            name: "PUBG Mobile 60 UC", 
            price: 10, 
            image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on.png?v=1779650124&width=1200",
            link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-60-uc?utm_source=copyToPasteBoard&utm_medium=product-links&utm_content=web"
        },
        { 
            name: "PUBG Mobile 325 UC", 
            price: 45, 
            image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_1.png?v=1779650145&width=1200",
            link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-325-uc?utm_source=copyToPasteBoard&utm_medium=product-links&utm_content=web"
        },
        { 
            name: "PUBG Mobile 660 UC", 
            price: 85, 
            image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_2.png?v=1779650163&width=1200",
            link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-660-uc?utm_source=copyToPasteBoard&utm_medium=product-links&utm_content=web"
        },
        { 
            name: "PUBG Mobile 1800 UC", 
            price: 215, 
            image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_3.png?v=1779650179&width=1200",
            link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-1800-uc?utm_source=copyToPasteBoard&utm_medium=product-links&utm_content=web"
        },
        { 
            name: "PUBG Mobile 3850 UC", 
            price: 425, 
            image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_4.png?v=1779650202&width=1200",
            link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-3850-uc?utm_source=copyToPasteBoard&utm_medium=product-links&utm_content=web"
        },
        { 
            name: "PUBG Mobile 8100 UC", 
            price: 850, 
            image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_5_-Photoroom.png?v=1779650243&width=1200",
            link: "https://sakuragamingstore.myshopify.com/products/pubg-mobile-8100-uc?utm_source=copyToPasteBoard&utm_medium=product-links&utm_content=web"
        }
    ];

    const grid = document.getElementById('product-grid');
    
    products.forEach((p) => {
        grid.innerHTML += `
            <div class="card">
                <img src="${p.image}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1542751110-97427bbecf20';">
                <h3>${p.name}</h3>
                <div class="price">${p.price} Dh</div>
                <a href="${p.link}" class="buy-btn" target="_blank">Satın Al</a>
            </div>
        `;
    });
</script>

</body>
</html>
