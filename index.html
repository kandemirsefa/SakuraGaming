<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Gaming | Premium UC Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sakura-pink: #ffb7c5; --sakura-dark: #1a1a2e; --kick-green: #53fc18; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: linear-gradient(rgba(26, 26, 46, 0.4), rgba(26, 26, 46, 0.65)), url('Cherry_Blossom_45_B.jpg'); 
            background-size: cover; background-attachment: fixed; color: #fff; padding: 20px; min-height: 100vh; overflow-x: hidden;
        }

        .header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
        .logo-img { width: 150px; margin-bottom: -10px; }
        .text-img { width: 300px; height: auto; }

        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: rgba(22, 33, 62, 0.8); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #ffb7c5; backdrop-filter: blur(5px); }
        .card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .buy-btn { display: block; background: var(--sakura-pink); color: var(--sakura-dark); padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 800; margin-top: 10px; }

        .live-stream { max-width: 800px; margin: 40px auto; border: 2px solid var(--kick-green); border-radius: 20px; overflow: hidden; }
        .responsive-iframe { position: relative; padding-top: 56.25%; }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .social-icons { text-align: center; margin-top: 30px; }
        .social-icons a { font-size: 2rem; color: var(--sakura-pink); margin: 0 15px; }

        .sakura-petal { position: fixed; background-color: var(--sakura-pink); border-radius: 50% 0; opacity: 0.6; pointer-events: none; animation: fall linear infinite; z-index: 1; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo-img" alt="Logo">
        <img src="yazi.png" class="text-img" alt="Sakura Gaming Yazı">
    </div>

    <div class="product-grid" id="product-grid"></div>

    <div class="live-stream">
        <div class="responsive-iframe">
            <iframe src="https://player.kick.com/sakuraharuno7" allowfullscreen="true"></iframe>
        </div>
    </div>

    <div class="social-icons">
        <a href="https://www.tiktok.com/@sakura___gaming" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://kick.com/sakuraharuno7" target="_blank"><i class="fa-solid fa-gamepad"></i></a>
    </div>

<script>
    const products = [
        { name: "60 UC", price: 10, image: "https://via.placeholder.com/150", link: "#" },
        { name: "325 UC", price: 45, image: "https://via.placeholder.com/150", link: "#" },
        { name: "660 UC", price: 85, image: "https://via.placeholder.com/150", link: "#" }
    ];
    const grid = document.getElementById('product-grid');
    products.forEach(p => {
        grid.innerHTML += `<div class="card"><img src="${p.image}"><p>${p.price} Dh</p><a href="${p.link}" class="buy-btn">Satın Al</a></div>`;
    });

    function createPetal() {
        const p = document.createElement('div');
        p.classList.add('sakura-petal');
        p.style.width = p.style.height = (Math.random() * 10 + 5) + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 3 + 3) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 6000);
    }
    setInterval(createPetal, 400);
</script>
</body>
</html>
