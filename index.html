<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Gaming | Premium UC Satış</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sakura-pink: #ffb7c5;
            --sakura-dark: #1a1a2e;
            --sakura-accent: #e94560;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body { 
            background-color: var(--sakura-dark); 
            color: var(--text-color);
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 183, 197, 0.05) 0%, transparent 50%);
        }

        nav { padding: 2rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--sakura-pink); letter-spacing: 2px; }

        .hero { text-align: center; padding: 4rem 1rem; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { color: #a0a0a0; margin-bottom: 2rem; }

        .container { max-width: 1100px; margin: auto; padding: 0 20px; }

        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 2rem; }

        .card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 183, 197, 0.1);
            border-radius: 20px; 
            padding: 20px; 
            transition: 0.4s;
        }

        .card:hover { transform: translateY(-10px); border-color: var(--sakura-pink); }

        .card img { width: 100%; height: 200px; border-radius: 15px; object-fit: cover; margin-bottom: 15px; }

        .card h3 { margin-bottom: 10px; }

        .btn { 
            display: block; width: 100%; padding: 12px; margin-top: 15px;
            background: var(--sakura-pink); color: var(--sakura-dark);
            text-align: center; text-decoration: none; font-weight: 700;
            border-radius: 10px; transition: 0.3s;
        }

        .btn:hover { background: var(--sakura-accent); color: white; }

        footer { text-align: center; padding: 4rem; color: #555; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">SAKURA GAMING</div>
    </nav>

    <header class="hero">
        <h1>Premium UC Yükleme</h1>
        <p>Hızlı, güvenli ve Sakura estetiğiyle oyun keyfi.</p>
    </header>

    <div class="container">
        <div class="products">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e" alt="UC">
                <h3>Global UC Paketleri</h3>
                <p style="color:var(--sakura-pink); margin-bottom:10px;">Anında Teslimat</p>
                <a href="#" class="btn">Satın Al</a>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc" alt="E-Pin">
                <h3>E-Pin Kodları</h3>
                <p style="color:var(--sakura-pink); margin-bottom:10px;">7/24 Aktif</p>
                <a href="#" class="btn">Satın Al</a>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1552820728-8b83bb6b773f" alt="TR">
                <h3>TR Sunucu Yükleme</h3>
                <p style="color:var(--sakura-pink); margin-bottom:10px;">En Uygun Fiyat</p>
                <a href="#" class="btn">Satın Al</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Sakura Gaming. Tüm hakları saklıdır.
    </footer>

</body>
</html>
