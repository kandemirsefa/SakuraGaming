<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Gaming | Premium Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff7aa2; --bg: #0a0a0c; --card: #15151b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 40px 20px; }
        .container { max-width: 1000px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        
        .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        
        .qty-box { margin: 15px 0; }
        .qty-box input { width: 60px; padding: 8px; background: #222; border: 1px solid #333; color: white; border-radius: 5px; text-align: center; }
        
        .price-tag { font-size: 22px; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .buy-btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .buy-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 40px;">UC Market</h1>
    <div class="grid" id="product-list">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542751110-97427bbecf20" alt="UC">
            <h3>Global UC</h3>
            <div class="qty-box">
                <label>Adet:</label>
                <input type="number" class="qty" value="1" min="1" onchange="updatePrice(this, 150)">
            </div>
            <div class="price-tag" data-base="150">150 TL</div>
            <button class="buy-btn" onclick="goToPayment('Global UC')">Satın Al</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420" alt="UC">
            <h3>E-Pin Paket</h3>
            <div class="qty-box">
                <label>Adet:</label>
                <input type="number" class="qty" value="1" min="1" onchange="updatePrice(this, 350)">
            </div>
            <div class="price-tag" data-base="350">350 TL</div>
            <button class="buy-btn" onclick="goToPayment('E-Pin Paket')">Satın Al</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8" alt="UC">
            <h3>TR Sunucu</h3>
            <div class="qty-box">
                <label>Adet:</label>
                <input type="number" class="qty" value="1" min="1" onchange="updatePrice(this, 650)">
            </div>
            <div class="price-tag" data-base="650">650 TL</div>
            <button class="buy-btn" onclick="goToPayment('TR Sunucu')">Satın Al</button>
        </div>
    </div>
</div>

<script>
    function updatePrice(input, basePrice) {
        let card = input.closest('.card');
        let priceDiv = card.querySelector('.price-tag');
        let total = input.value * basePrice;
        priceDiv.innerText = total + " TL";
    }

    function goToPayment(productName) {
        // Buraya ödeme sayfasına yönlendirme linkini ekle
        alert(productName + " satın alma sayfasına yönlendiriliyorsunuz...");
        window.location.href = "https://wa.me/905xxxxxxxxx"; // Örnek olarak WhatsApp linki
    }
</script>

</body>
</html>
