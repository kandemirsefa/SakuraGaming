<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Gaming | Premium UC Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --sakura-pink: #ffb7c5; 
            --sakura-dark: #1a1a2e; 
            --sakura-card: rgba(22, 33, 62, 0.85); 
            --text-color: #ffffff; 
            --kick-green: #53fc18;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-image: linear-gradient(rgba(26, 26, 46, 0.4), rgba(26, 26, 46, 0.65)), url('Cherry_Blossom_45_B.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; 
            color: var(--text-color); 
            padding: 20px 20px 0 20px; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .content-wrapper { flex: 1; position: relative; z-index: 2; }
        
        .header { text-align: center; margin-bottom: 20px; padding-top: 20px; }
        .site-name { font-size: 2.8rem; color: var(--sakura-pink); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .subtitle { color: #eee; margin-top: 5px; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); font-weight: 600; }

        .tiktok-container { text-align: center; margin-bottom: 40px; }
        .tiktok-btn { 
            display: inline-flex; align-items: center; gap: 10px; background: #000; color: #fff; 
            padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: 800; 
            border: 2px solid var(--sakura-pink); transition: 0.3s; font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .tiktok-btn:hover { background: var(--sakura-pink); color: #000; transform: scale(1.05); }

        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; max-width: 1000px; margin: 0 auto 50px auto; }
        
        .card { background-color: var(--sakura-card); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid rgba(45, 52, 86, 0.5); transition: 0.3s; backdrop-filter: blur(6px); }
        .card:hover { transform: translateY(-8px); border-color: var(--sakura-pink); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .card img { width: 100%; height: auto; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .card h3 { margin-bottom: 10px; font-size: 1rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .price { font-size: 1.2rem; font-weight: 800; color: var(--sakura-pink); margin-bottom: 15px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        .buy-btn { background-color: var(--sakura-pink); color: var(--sakura-dark); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; text-decoration: none; display: block; width: 100%; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .buy-btn:hover { opacity: 0.9; transform: scale(1.02); }

        .live-stream-container { max-width: 800px; margin: 20px auto 50px auto; background: rgba(22, 33, 62, 0.9); border-radius: 20px; padding: 20px; border: 2px solid var(--kick-green); box-shadow: 0 0 20px rgba(83, 252, 24, 0.2); text-align: center; backdrop-filter: blur(6px); }
        .live-stream-title { font-size: 1.2rem; font-weight: 800; color: #ffffff; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .live-pulse { width: 10px; height: 10px; background-color: var(--kick-green); border-radius: 50%; animation: pulse 1.5s infinite; }
        .responsive-iframe { position: relative; overflow: hidden; width: 100%; padding-top: 56.25%; border-radius: 12px; }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .site-footer { background-color: rgba(26, 26, 46, 0.95); border-top: 2px solid rgba(255, 183, 197, 0.3); padding: 30px 20px; margin-top: 50px; text-align: center; }
