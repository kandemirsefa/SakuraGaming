<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Gaming | Premium UC Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --sakura-pink: #ffb7c5; 
            --sakura-dark: #1a1a2e; 
            --sakura-card: rgba(22, 33, 62, 0.85); 
            --text-color: #ffffff; 
            --kick-green: #53fc18;
            --tiktok-pink: #fe2c55;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-image: linear-gradient(rgba(26, 26, 46, 0.4), rgba(26, 26, 46, 0.65)), url('Cherry_Blossom_45_B.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; 
            color: var(--text-color); padding: 20px 20px 0 20px; min-height: 100vh; overflow-x: hidden;
        }
        
        .content-wrapper { flex: 1; position: relative; z-index: 2; max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        .site-name { font-size: 2.8rem; color: var(--sakura-pink); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .subtitle { color: #eee; margin-top: 5px; font-weight: 600; }

        /* TIKTOK YAYIN GÖRSELİ ALANI */
        .tiktok-preview {
            max-width: 800px; margin: 20px auto; background: rgba(22, 33, 62, 0.9); border-radius: 20px; padding: 20px;
            border: 2px solid var(--tiktok-pink); text-align: center; backdrop-filter: blur(6px);
        }
        .tiktok-btn-box { display: block; text-decoration: none; position: relative; border-radius: 12px; overflow: hidden; }
        .tiktok-btn-box img { width: 100%; height: auto; border-radius: 12px; display: block; }
        .live-tag { background: var(--tiktok-pink); padding: 5px 15px; border-radius: 5px; font-weight: bold; display: inline-block; margin-bottom: 10px; }

        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin: 0 auto 50px auto; }
        .card { background-color: var(--sakura-card); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid rgba(45, 52, 86, 0.5); transition: 0.3s; backdrop-filter: blur(6px); }
        .card:hover { transform: translateY(-8px); border-color: var(--sakura-pink); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .price { font-size: 1.2rem; font-weight: 800; color: var(--sakura-pink); margin-bottom: 15px; }
        .buy-btn { background-color: var(--sakura-pink); color: var(--sakura-dark); border: none; padding: 12px; border-radius: 8px; font-weight: 800; text-decoration: none; display: block; }

        .live-stream-container { max-width: 800px; margin: 20px auto 50px auto; background: rgba(22, 33, 62, 0.9); border-radius: 20px; padding: 20px; border: 2px solid var(--kick-green); text-align: center; }
        .responsive-iframe { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="content-wrapper">
    <div class="header">
        <div class="site-name">SAKURA GAMING</div>
        <p class="subtitle">Centre de recharge UC sécurisé et rapide</p>
    </div>

    <!-- TIKTOK YAYIN BUTONU (SİTE ADI ALTINDA) -->
    <div class="tiktok-preview">
        <a href="https://www.tiktok.com/@sakura___gaming/live" target="_blank" class="tiktok-btn-box">
            <div class="live-tag"><i class="fab fa-tiktok"></i> TIKTOK CANLI YAYINA GİT</div>
            <img src="https://images.unsplash.com/photo-1542751110-97427bbecf20?auto=format&fit=crop&w=800&q=400" alt="TikTok Canlı">
        </a>
    </div>

    <div class="product-grid" id="product-grid"></div>

    <!-- KICK YAYINI -->
    <div class="live-stream-container">
        <div class="live-stream-title" style="margin-bottom:15px; font-weight:800;">SAKURA GAMING KICK CANLI YAYINI</div>
        <div class="responsive-iframe">
            <iframe src="https://player.kick.com/sakuraharuno7" allowfullscreen="true"></iframe>
        </div>
    </div>
</div>

<script>
    const products = [
        { name: "PUBG Mobile 60 UC", price: 10, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on.png?v=1779650124&width=1200", link: "#" },
        { name: "PUBG Mobile 325 UC", price: 45, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_1.png?v=1779650145&width=1200", link: "#" },
        { name: "PUBG Mobile 660 UC", price: 85, image: "https://sakuragamingstore.myshopify.com/cdn/shop/files/Gemini_Generated_Image_7onq0p7on_2.png?v=1779650163&width=1200", link: "#" }
    ];

    const grid = document.getElementById('product-grid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="card">
                <img src="${p.image}" alt="${p.name}">
                <h3>${p.name}</h3>
                <div class="price">${p.price} Dh</div>
                <a href="${p.link}" class="buy-btn">Satın Al</a>
            </div>
        `;
    });
</script>

</body>
</html>
